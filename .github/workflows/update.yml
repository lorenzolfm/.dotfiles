# Once a week, a pull request for each pin this repository can move on its own: Neovim's
# plugins, the installed skills, and flake.lock.
#
# A bump runs code from upstream (plugin build steps, the skills CLI), so it runs without write
# access and hands a patch to the job that opens the pull request. A pull request opened with the
# workflow's token does not trigger CI, so each bump runs its own verification, reports it in the
# pull request, and opens it as a draft when it fails.

name: Update

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nvim-plugins:
    name: bump neovim plugins
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.hand-off.outputs.changed }}
      verified: ${{ steps.verify.outcome == 'success' }}
    env:
      XDG_CONFIG_HOME: ${{ github.workspace }}/.config
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          github_access_token: ${{ github.token }}
      - name: Update the plugins
        run: |
          export UPDATE_SUMMARY="$RUNNER_TEMP/body.md"
          nix develop .#nvim --command nvim --headless --cmd "luafile .github/nvim-update.lua"
      - name: Start Neovim on the new pins
        id: verify
        continue-on-error: true
        run: nix develop .#nvim --command nvim --headless --cmd "luafile .github/nvim-smoke.lua"
      - id: hand-off
        uses: ./.github/actions/hand-off
        with:
          name: nvim-plugins
          verified: ${{ steps.verify.outcome }}

  skills:
    name: bump skills
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.hand-off.outputs.changed }}
      verified: ${{ steps.verify.outcome == 'success' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          github_access_token: ${{ github.token }}
      # The skills CLI installs under ~/.agents, which stow links to this repository's .agents.
      - run: ln -s "$GITHUB_WORKSPACE/.agents" ~/.agents
      - name: Update the skills
        env:
          DO_NOT_TRACK: "1"
          # Read-only in this job. It lifts the rate limit on the CLI's GitHub API calls.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          nix develop .#skills --command npx --yes skills update --global --yes | tee "$RUNNER_TEMP/skills.log"
          { echo '```'; sed 's/\x1b\[[0-9;]*[A-Za-z]//g' "$RUNNER_TEMP/skills.log" | tr -d '\r'; echo '```'; } > "$RUNNER_TEMP/body.md"
          # A flake sees only the files git tracks, and an update can add files.
          git add --all .agents
      - name: Check the installed skills against the lock file
        id: verify
        continue-on-error: true
        run: nix build --no-link --print-build-logs .#checks.x86_64-linux.skills
      - id: hand-off
        uses: ./.github/actions/hand-off
        with:
          name: skills
          verified: ${{ steps.verify.outcome }}

  flake-lock:
    name: bump flake.lock
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.hand-off.outputs.changed }}
      verified: ${{ steps.verify.outcome == 'success' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          github_access_token: ${{ github.token }}
      - name: Update the inputs
        run: |
          nix flake update 2>&1 | tee "$RUNNER_TEMP/flake.log"
          { echo '```'; cat "$RUNNER_TEMP/flake.log"; echo '```'; } > "$RUNNER_TEMP/body.md"
      - name: Run the gates on the new inputs
        id: verify
        continue-on-error: true
        run: nix flake check --print-build-logs
      - id: hand-off
        uses: ./.github/actions/hand-off
        with:
          name: flake-lock
          verified: ${{ steps.verify.outcome }}

  pull-request:
    name: open the ${{ matrix.update }} pull request
    needs: [nvim-plugins, skills, flake-lock]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - update: nvim-plugins
            title: "chore(nvim): update plugins"
          - update: skills
            title: "chore(skills): update skills"
          - update: flake-lock
            title: "chore(nix): update flake.lock"
    env:
      CHANGED: ${{ needs[matrix.update].outputs.changed == 'true' }}
    steps:
      - if: env.CHANGED == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: env.CHANGED == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.update }}
          path: ${{ runner.temp }}/update
      - if: env.CHANGED == 'true'
        run: git apply "$RUNNER_TEMP/update/update.patch"
      - if: env.CHANGED == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: update/${{ matrix.update }}
          title: ${{ matrix.title }}
          commit-message: ${{ matrix.title }}
          body-path: ${{ runner.temp }}/update/body.md
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          draft: ${{ needs[matrix.update].outputs.verified == 'true' && 'false' || 'always-true' }}
          delete-branch: true
